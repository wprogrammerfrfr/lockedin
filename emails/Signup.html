<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Verify your LockedIn email</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family:
        -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
        sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f8fafc; width: 100%;"
    >
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border: 1px solid #e2e8f0;
              border-radius: 8px;
              box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            "
          >
            <tr>
              <td
                align="center"
                style="
                  padding: 32px;
                  text-align: center;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                    Helvetica, Arial, sans-serif;
                  color: #0f172a;
                "
              >
                <h1
                  style="
                    margin: 0 0 8px 0;
                    font-size: 28px;
                    font-weight: 700;
                    letter-spacing: -0.02em;
                    line-height: 1.2;
                    color: #0f172a;
                  "
                >
                  <span style="display: inline-block">
                    <span style="color: #0f172a; vertical-align: baseline"
                      >Locked</span
                    ><span
                      style="
                        display: inline-block;
                        margin-left: 3px;
                        vertical-align: baseline;
                        background: #a3e635;
                        color: #ffffff;
                        font-size: 28px;
                        font-weight: 700;
                        line-height: 1;
                        padding: 3px 5px 4px;
                        border-radius: 5px;
                        text-transform: none;
                        letter-spacing: -0.02em;
                      "
                      >in</span
                    >
                    <span
                      style="
                        display: block;
                        margin-top: 4px;
                        height: 3px;
                        background: #a3e635;
                        border-radius: 999px;
                      "
                    ></span>
                  </span>
                </h1>
                <h2
                  style="
                    margin: 24px 0 12px 0;
                    font-size: 20px;
                    font-weight: 700;
                    color: #0f172a;
                    line-height: 1.3;
                  "
                >
                  Verify email to lock in
                </h2>
                <p
                  style="
                    margin: 0 0 28px 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #334155;
                  "
                >
                  Confirm your email to activate your account and start locking
                  in.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background-color: #84cc16;
                    color: #ffffff;
                    font-size: 16px;
                    font-weight: 700;
                    text-decoration: none;
                    border-radius: 8px;
                    padding: 12px 24px;
                    line-height: 1.25;
                  "
                  >Verify Email Address</a
                >
                <p
                  style="
                    margin: 28px 0 0 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: #64748b;
                  "
                >
                  If you didn&rsquo;t create a LockedIn account, you can ignore
                  this email.
                </p>
              </td>
            </tr>
          </table>
          <p
            style="
              margin: 24px 0 0 0;
              font-size: 12px;
              color: #94a3b8;
              font-family:
                -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
                Arial, sans-serif;
            "
          >
            LockedIn &mdash; deep work, tracked.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
